<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="700" viewBox="0 0 440 590"><title>Washing Machine front section — linework from the project design reference</title><defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#245b78" />
    </marker>
    <style>
      .outline{fill:none;stroke:#202b33;stroke-width:2.2}
      .heavy{fill:none;stroke:#111820;stroke-width:3}
      .thin{fill:none;stroke:#647784;stroke-width:1.2}
      .hidden{fill:none;stroke:#8c9aa3;stroke-width:1.2;stroke-dasharray:7 6}
      .water{fill:#9edcf2;fill-opacity:.42;stroke:#3b9fc5;stroke-width:1.5}
      .metal{fill:#d8e0e5;stroke:#303c45;stroke-width:1.6}
      .print{fill:#eef3f5;stroke:#303c45;stroke-width:1.6}
      .electronics{fill:#ffe8a3;fill-opacity:.65;stroke:#9c7720;stroke-width:1.6}
      .motor{fill:#d9c7ee;stroke:#654c82;stroke-width:1.6}
      .dim{fill:none;stroke:#245b78;stroke-width:1.4;marker-start:url(#arrow);marker-end:url(#arrow)}
      .ext{fill:none;stroke:#668293;stroke-width:1}
      .center{fill:none;stroke:#b05555;stroke-width:1;stroke-dasharray:10 4 2 4}
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#18232b}
      .title{font-size:28px;font-weight:700}
      .view{font-size:21px;font-weight:700}
      .label{font-size:16px}
      .small{font-size:14px;fill:#43545f}
      .dtxt{font-size:17px;font-weight:700;fill:#245b78}
      .note{font-size:15px;fill:#714f00}
    </style>
  </defs>

